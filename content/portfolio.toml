**[Background]**

● Built a <mark>software-programmable dual-clock Attention SoC accelerator subsystem</mark> for Transformer inference, covering CPU configuration, DMA transfers, clock-domain crossing, result write-back, and interrupt notification.

![Transformer Attention Accelerator SoC System Architecture](/images/attention-soc-system-architecture.png)

![Attention Core Microarchitecture](/images/attention-core-microarchitecture-en.png)

**[Function]**

● Integrated a <mark>500 MHz bus domain</mark> with a <mark>1.25 GHz compute domain</mark>: <mark>AHB-Lite</mark> for register configuration and interrupts, <mark>128-bit AXI4-MM DMA</mark> for Q/K/V and result transfers, and <mark>asynchronous FIFOs</mark> for clock-domain crossing.

● Reused an <mark>8×8 FP16 systolic array</mark> for QK^T and PV; added <mark>8-way parallel Softmax</mark> plus score/probability queues so matrix compute, Softmax, and accumulation advance concurrently.

● Reduced dual-clock CDC Error/Fatal findings from <mark>65 to 0</mark> using <mark>VC Static</mark>.

● Established Python reference-model, <mark>VCS regression</mark>, <mark>SVA</mark>, and functional-coverage verification flows.

**[Realization]**

● Reduced compute cycles from 342,228 to <mark>79,489 (-76.8%)</mark> and end-to-end task cycles from 350,429 to <mark>105,112 (-70.0%)</mark> for N=64, d=32 attention.

● Achieved <mark>98.48% functional coverage</mark>, <mark>0 SVA failures</mark>, and <mark>0 numerical mismatches</mark> across four final regressions.

● Completed pre-layout STA for four critical modules using Yosys, ASAP7 RVT TT libraries, and OpenSTA, achieving <mark>WNS/TNS = 0 at 1.25 GHz</mark> with 50 ps clock uncertainty.
"""

